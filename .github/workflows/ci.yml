name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Tests (Ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite via pytest
        run: |
          pytest -v tests

  security-audit:
    name: Static & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify AST Import Isolation (Zero owner_tools in client)
        run: |
          python -m unittest tests/test_import_isolation.py -v

      - name: Verify Key Vault Security & Crypto Backend
        run: |
          python -m unittest tests/test_key_vault_automated.py -v

      - name: Audit PyInstaller Spec File
        run: |
          python -m owner_tools.bundle_inspector --audit-spec sims4_manager.spec

      - name: Verify Repository Cleanliness (No committed secrets or databases)
        run: |
          FORBIDDEN=$(git ls-files | grep -E '\.(vault|key|db|db-wal|db-shm|part)$|^oauth\.dat$|challenge_registry\.db' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Forbidden sensitive files detected in git index:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Repository cleanliness audit PASSED: 0 forbidden files tracked."

  windows-build:
    name: Windows Standalone Build & Bundle Audit
    needs: [test, security-audit]
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build standalone client executable via PyInstaller
        run: |
          pyinstaller --clean --noconfirm sims4_manager.spec

      - name: Execute post-build bundle security audit
        run: |
          python -m owner_tools.bundle_inspector --audit-bundle dist/Sims4_Store_Alpha --store-id store_alpha

      - name: Generate SHA256.txt checksums for release bundle
        run: |
          python -c "import hashlib, os; p = 'dist/Sims4_Store_Alpha'; lines = [f'{hashlib.sha256(open(os.path.join(p, f), \"rb\").read()).hexdigest()}  {f}' for f in sorted(os.listdir(p)) if os.path.isfile(os.path.join(p, f)) and f != 'SHA256.txt']; open(os.path.join(p, 'SHA256.txt'), 'w', encoding='utf-8').write('\n'.join(lines) + '\n'); print(f'Successfully generated SHA256.txt with {len(lines)} file hashes.')"

      - name: Upload compiled client artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sims4_Store_Alpha-windows-x64
          path: dist/Sims4_Store_Alpha
          if-no-files-found: error
          retention-days: 14
